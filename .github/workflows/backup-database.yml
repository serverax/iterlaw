# Database backup template — run manually until Supabase / AWS credentials are configured.
# Scheduled runs are disabled by default to avoid failing cron jobs in forks.
name: Database backup

on:
  workflow_dispatch:
  # Uncomment when secrets SUPABASE_DB_URL (or discrete PG vars) and AWS creds are set:
  # schedule:
  #   - cron: '0 2 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    if: vars.DATABASE_BACKUP_ENABLED == 'true'
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pg_dump "$DATABASE_URL" --no-owner --format=custom -f backup.dump

      - name: Configure AWS (optional)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Upload to S3
        run: aws s3 cp backup.dump "s3://${{ secrets.AWS_BACKUP_BUCKET }}/$(date -u +%Y-%m-%d)/rightsnow.dump"
