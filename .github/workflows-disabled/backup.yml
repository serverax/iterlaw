# Database backup — gated so forks and new repos do not fail nightly.
# Enable: set variable DATABASE_BACKUP_ENABLED=true and configure secrets (see .github/DEVOPS.md).
name: Daily backup

on:
  workflow_dispatch:
  # Uncomment after secrets are set:
  # schedule:
  #   - cron: '0 2 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    if: vars.DATABASE_BACKUP_ENABLED == 'true'
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pg_dump "$DATABASE_URL" --no-owner --format=custom -f backup.dump

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Upload to S3
        run: aws s3 cp backup.dump "s3://${{ secrets.AWS_BACKUP_BUCKET }}/$(date -u +%Y-%m-%d)/rightsnow.dump"

      - name: Notify Slack
        if: vars.SLACK_NOTIFY_ENABLED == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Database backup completed for ${{ github.repository }}"
            }
