apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-orchestrator
  template:
    metadata:
      labels:
        app: ai-orchestrator
    spec:
      containers:
        - name: ai-orchestrator
          image: iterlawacr3729.azurecr.io/ai-orchestrator:1.0.3
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator-service
spec:
  type: LoadBalancer
  selector:
    app: ai-orchestrator
  ports:
    - port: 80
      targetPort: 3001