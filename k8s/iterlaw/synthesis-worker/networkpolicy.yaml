apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synthesis-worker
  namespace: iterlaw-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synthesis-worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # No external ingress; metrics scraping is permitted only from
    # workloads carrying the explicit label below.
    - from:
        - podSelector:
            matchLabels:
              iterlaw.metrics-scraper: "true"
      ports:
        - protocol: TCP
          port: 9100
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synthesis-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # When MODEL_MODE=internal, the worker reaches the existing internal
    # Ollama service in ordinox-ai (ClusterIP 11434). This is the ONLY
    # cross-namespace egress permitted from synthesis-worker. The
    # legal-orchestrator NetworkPolicy does NOT permit this rule — the
    # boundary is enforced here, in the worker only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ordinox-ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
