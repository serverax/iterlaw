apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legal-orchestrator
  namespace: iterlaw-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: legal-orchestrator
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iterlaw-web
      ports:
        - protocol: TCP
          port: 3012
  egress:
    # synthesis-redis (in-cluster, iterlaw-ai)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synthesis-redis
      ports:
        - protocol: TCP
          port: 6379
    # iterlaw-postgres (in-cluster, iterlaw-data)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iterlaw-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: iterlaw-postgres
      ports:
        - protocol: TCP
          port: 5432
    # DNS for in-cluster lookups
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
