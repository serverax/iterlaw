# Production deploy — manual only. Requires typed confirmation.
# Set VERCEL_DEPLOY_ENABLED and production Vercel secrets before use.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type YES to confirm production deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.confirmation == 'YES' && vars.VERCEL_PROD_DEPLOY_ENABLED == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDc5NzI4MDAsImV4cCI6MTk2MzU0ODgwMH0.E316OMskv_dswTnvNDcDsFkXORI_MTO1SmIzsTbfvsQ' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: CI gate
        run: npm run ci

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
          scope: ${{ secrets.VERCEL_SCOPE }}
          working-directory: ./
          vercel-args: '--prod'

      # Optional: replace with a real health endpoint when available.
      - name: Smoke check (optional URL)
        if: vars.PRODUCTION_URL != ''
        continue-on-error: true
        run: |
          curl -fsS "${{ vars.PRODUCTION_URL }}/" -o /dev/null || true

      - name: Notify Slack (success)
        if: success() && vars.SLACK_NOTIFY_ENABLED == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🚀 Production deploy succeeded: ${{ github.repository }} @ ${{ github.sha }}"
            }

      - name: Notify Slack (failure)
        if: failure() && vars.SLACK_NOTIFY_ENABLED == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Production deploy failed: ${{ github.repository }} — check Actions logs."
            }
