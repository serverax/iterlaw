name: Build Docker Images

on:
  push:
    branches: [main, feature/github-automation]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push RAG API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/legal-orchestrator/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/iterlaw-rag-api:latest
            ${{ secrets.DOCKER_USERNAME }}/iterlaw-rag-api:${{ github.sha }}
