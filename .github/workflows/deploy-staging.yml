# Auto-deploy to Vercel staging when pushing to master.
# Enable by setting repository variable VERCEL_DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables)
# and configuring Vercel secrets below.
name: Deploy staging

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Vercel (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: vars.VERCEL_DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build -w @rightsnow/shared && npm run build -w @rightsnow/web

      - name: Deploy to Vercel (preview / staging target)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}
          scope: ${{ secrets.VERCEL_SCOPE }}
          working-directory: ./
          vercel-args: '--prod=false'

      - name: Notify Slack
        if: vars.SLACK_NOTIFY_ENABLED == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Staging deploy: ${{ github.repository }} @ ${{ github.sha }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Staging*\nCommit: `${{ github.sha }}`\nSet `STAGING_URL` variable for links in future."
                  }
                }
              ]
            }

      # Add Playwright or API smoke tests here when E2E_BASE_URL and tests exist.
      # - name: E2E smoke
      #   run: npm run test:e2e
      #   env:
      #     E2E_BASE_URL: ${{ vars.STAGING_URL }}
