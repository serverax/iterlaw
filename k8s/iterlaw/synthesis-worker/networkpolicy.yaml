apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synthesis-worker
  namespace: iterlaw-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synthesis-worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # No external ingress; metrics scraping is permitted only from
    # workloads carrying the explicit label below.
    - from:
        - podSelector:
            matchLabels:
              iterlaw.metrics-scraper: "true"
      ports:
        - protocol: TCP
          port: 9100
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synthesis-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # When MODEL_MODE=internal, an additional NetworkPolicy must be applied
    # by the operator to permit egress to the in-cluster internal model
    # endpoint. This file deliberately does not whitelist any model
    # destination.
