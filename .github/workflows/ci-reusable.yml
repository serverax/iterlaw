# Shared CI job — invoked by ci.yml (push) and pull-request.yml (PRs to master).
on:
  workflow_call:

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDc5NzI4MDAsImV4cCI6MTk2MzU0ODgwMH0.E316OMskv_dswTnvNDcDsFkXORI_MTO1SmIzsTbfvsQ' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (Next.js)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:ci -- --coverageReporters=lcov --coverageReporters=text-summary
        env:
          CI: true
          NODE_ENV: test

      # Match Deploy IterLaw "Verify Static Web App build" — materialize workspace package
      # so Next build matches deploy and avoids symlink-only layouts on the runner.
      - name: Production build
        run: |
          set -e
          mkdir -p apps/web/node_modules/@rightsnow
          rm -rf apps/web/node_modules/@rightsnow/shared
          cp -a packages/shared apps/web/node_modules/@rightsnow/shared
          npm run build -w @rightsnow/shared && npm run build -w @rightsnow/web

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: hashFiles('coverage/lcov.info') != ''
        continue-on-error: true
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
