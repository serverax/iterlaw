apiVersion: v1
kind: ServiceAccount
metadata:
  name: iterlaw-postgres
  namespace: iterlaw-data
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iterlaw-postgres
  namespace: iterlaw-data
  labels:
    app.kubernetes.io/name: iterlaw-postgres
    app.kubernetes.io/part-of: iterlaw
spec:
  serviceName: iterlaw-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iterlaw-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iterlaw-postgres
        app.kubernetes.io/part-of: iterlaw
    spec:
      serviceAccountName: iterlaw-postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # postgres UID/GID in the Debian-based pgvector/pgvector:pg16 image
        # is 999 (the official postgres:16 base). When we previously used
        # postgres:16-alpine this was 70 — do not "downgrade" without also
        # changing the image, or PGDATA permissions will break on first boot.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # pgvector/pgvector:pg16 is the upstream pgvector image built on
          # the official postgres:16 base. It ships the `vector` extension
          # binary so migration 000_pgvector_prerequisite.sql can run
          # `CREATE EXTENSION IF NOT EXISTS vector;`. Without this image
          # the embedding column and IVFFlat index in migration 001 cannot
          # be created and RAG retrieval would silently degrade to FTS-only.
          # The backup CronJob in ../backups/cronjob.yaml still uses
          # postgres:16-alpine because pg_dump does not need the extension.
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iterlaw-postgres-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iterlaw-postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iterlaw-postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 32Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: iterlaw-postgres
          app.kubernetes.io/part-of: iterlaw
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
