apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iterlaw-postgres-backup
  namespace: iterlaw-data
  labels:
    app.kubernetes.io/name: iterlaw-postgres-backup
    app.kubernetes.io/part-of: iterlaw
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iterlaw-postgres-backup
  namespace: iterlaw-data
  labels:
    app.kubernetes.io/name: iterlaw-postgres-backup
    app.kubernetes.io/part-of: iterlaw
spec:
  # 02:15 every night. Adjust per operations review.
  schedule: "15 2 * * *"
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iterlaw-postgres-backup
            app.kubernetes.io/part-of: iterlaw
        spec:
          restartPolicy: Never
          # Reuse the iterlaw-postgres SA. Both the StatefulSet pod and
          # the backup pod are bound to the same no-api Role in
          # k8s/iterlaw-data/rbac.yaml, so neither has any Kubernetes
          # API permissions. Defense-in-depth keeps the default SA
          # in iterlaw-data unreferenced by any IterLaw workload.
          serviceAccountName: iterlaw-postgres
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: iterlaw-postgres.iterlaw-data.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: iterlaw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: iterlaw-postgres-credentials
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: iterlaw-postgres-credentials
                      key: POSTGRES_PASSWORD
              # Alerting hooks (placeholders only — no real values committed).
              # The upload + verify CronJobs read the matching SealedSecret;
              # until that is sealed in-cluster the alerts are no-ops.
              # See docs/infra/BACKUP_AND_RESTORE_RUNBOOK.md §7.
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backups/iterlaw-${ts}.dump"
                  echo "writing ${out}"

                  # Build the schema list defensively. `uk_emp_rag` is only
                  # present after migration 003; on a fresh database we
                  # must not fail just because that schema does not yet
                  # exist. `public` is always included.
                  schemas="--schema=public"
                  has_uk_emp_rag="$(psql -tA -c "SELECT 1 FROM pg_namespace WHERE nspname = 'uk_emp_rag'" 2>/dev/null || true)"
                  if [ "${has_uk_emp_rag}" = "1" ]; then
                    schemas="${schemas} --schema=uk_emp_rag"
                  else
                    echo "note: uk_emp_rag schema absent — dumping public only"
                  fi

                  # `--format=custom` is the only format that `pg_restore`
                  # supports for selective restore. It is already compressed
                  # (libpq's pglz) — no gzip pipe needed.
                  pg_dump --format=custom --no-owner --no-privileges \
                    ${schemas} \
                    --file="${out}"
                  sha256sum "${out}" > "${out}.sha256"
                  echo "backup complete:"
                  ls -lh "${out}" "${out}.sha256"
              # Retention is intentionally manual. Old files in /backups
              # accumulate until an operator prunes them. See README.md.
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: iterlaw-postgres-backup
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
