apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synthesis-redis
  namespace: iterlaw-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synthesis-redis
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: legal-orchestrator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synthesis-worker
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
