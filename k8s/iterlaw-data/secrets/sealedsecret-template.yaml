# SealedSecret templates for the iterlaw-data namespace.
#
# Two SealedSecrets are expected:
#
#   1. iterlaw-postgres-credentials — consumed by the Postgres StatefulSet
#      and the backup CronJob. Holds POSTGRES_USER and POSTGRES_PASSWORD.
#
#   2. iterlaw-postgres-replication-credentials — placeholder for future
#      replica/streaming-replication setup. Not consumed by any current
#      workload. Keep encrypted even if unused; do not delete the entry.
#
# Sealing workflow — see docs/infra/ITERLAW_SECRETS_RUNBOOK.md.
# DO NOT paste plaintext values here.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: iterlaw-postgres-credentials
  namespace: iterlaw-data
spec:
  encryptedData:
    POSTGRES_USER: REPLACE_ME_WITH_KUBESEAL_OUTPUT
    POSTGRES_PASSWORD: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: iterlaw-postgres-credentials
      namespace: iterlaw-data
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: iterlaw-postgres-replication-credentials
  namespace: iterlaw-data
spec:
  encryptedData:
    REPLICATION_USER: REPLACE_ME_WITH_KUBESEAL_OUTPUT
    REPLICATION_PASSWORD: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: iterlaw-postgres-replication-credentials
      namespace: iterlaw-data
    type: Opaque
