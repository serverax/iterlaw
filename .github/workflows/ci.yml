# Continuous integration — same checks as PR Validation, on every push to mainline branches.
# CI only. Deployment workflows live under .github/workflows-disabled/ until
# the K3s path is approved; see docs/infra/ITERLAW_WORKFLOW_INVENTORY.md.
name: CI

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit
