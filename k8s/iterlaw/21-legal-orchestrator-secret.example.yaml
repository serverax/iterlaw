# Example secret manifest for `iterlaw-legal-orchestrator-secrets`.
# DO NOT commit real values. The orchestrator reads DATABASE_URL from
# this secret; the value is assembled from the Postgres credentials.
#
# Real usage: kubeseal as documented in 11-postgres-secret.example.yaml.

apiVersion: v1
kind: Secret
metadata:
  name: iterlaw-legal-orchestrator-secrets
  namespace: iterlaw
  annotations:
    iterlaw.io/example-only: "true"
type: Opaque
stringData:
  DATABASE_URL: postgresql://REPLACE_ME_USER:REPLACE_ME_PASSWORD@iterlaw-postgres.iterlaw.svc.cluster.local:5432/iterlaw?sslmode=disable
