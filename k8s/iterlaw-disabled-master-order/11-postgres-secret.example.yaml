# Example secret manifest for `iterlaw-postgres-credentials`.
# DO NOT commit real values. Replace the example values below with
# kubeseal-encrypted output for production. The Master Order requires
# example-only secrets in the repository.
#
# Real usage:
#   1. Copy this file to /tmp/iterlaw-postgres-credentials.raw.yaml
#   2. Edit POSTGRES_USER / POSTGRES_PASSWORD with real values
#   3. Pipe through kubeseal:
#        kubeseal --controller-namespace kube-system \
#                 --controller-name sealed-secrets-controller \
#                 --format yaml \
#                 < /tmp/iterlaw-postgres-credentials.raw.yaml \
#                 > k8s/iterlaw/sealed/iterlaw-postgres-credentials.yaml
#   4. Shred the raw file: shred -u /tmp/iterlaw-postgres-credentials.raw.yaml
#
# The repository verifier rejects any `kind: Secret` checked in with
# `stringData` non-empty. This example file uses placeholder values
# that are obviously not real credentials.

apiVersion: v1
kind: Secret
metadata:
  name: iterlaw-postgres-credentials
  namespace: iterlaw
  annotations:
    iterlaw.io/example-only: "true"
type: Opaque
stringData:
  POSTGRES_USER: REPLACE_ME_NOT_A_REAL_USER
  POSTGRES_PASSWORD: REPLACE_ME_NOT_A_REAL_PASSWORD
  POSTGRES_DB: iterlaw
