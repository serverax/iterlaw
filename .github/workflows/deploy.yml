# IterLaw — Azure Static Web Apps + Azure Functions (RBAC via azure/login; no publish profile / no Kudu basic auth).
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS — JSON from: az ad sp create-for-rbac --name "github-iterlaw-deploy" --role "Website Contributor" \
#     --scopes /subscriptions/<SUB_ID>/resourceGroups/<RG>/providers/Microsoft.Web/sites/iterlaw-api-001 --json-auth
#   AZURE_STATIC_WEB_APPS_API_TOKEN — SWA → Manage deployment token
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY — optional; override CI build defaults below for production prerender
#
# OIDC alternative (no client secret in GitHub): grant the identity Website Contributor on iterlaw-api-001, add a
# federated credential for this repo, then replace the Azure Login step with client-id / tenant-id / subscription-id
# and set job permissions: id-token: write. See https://github.com/Azure/functions-action#use-oidc-recommended
name: Deploy IterLaw

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Public Supabase demo-style defaults allow `next build` prerender when secrets are not configured.
      # Set repository secrets to your real project for production-accurate builds.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDc5NzI4MDAsImV4cCI6MTk2MzU0ODgwMH0.E316OMskv_dswTnvNDcDsFkXORI_MTO1SmIzsTbfvsQ' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Notice — Supabase public env for Next build
        run: |
          if [ "$NEXT_PUBLIC_SUPABASE_URL" = "https://example.supabase.co" ]; then
            echo '::notice::NEXT_PUBLIC_SUPABASE_* not set in secrets; using CI-safe defaults for prerender. Set secrets for production.'
          fi

      # Same command as SWA Oryx (app_build_command); fails here before Azure deploy if the web app cannot build.
      - name: Verify Static Web App build (Oryx parity)
        run: npm run build -w @rightsnow/shared && npm run build -w @rightsnow/web

      - name: Build Azure Functions app (@rightsnow/api)
        run: npm run build -w @rightsnow/shared && npm run build -w @rightsnow/legal-core && npm run build -w @rightsnow/api

      - name: Install API production dependencies
        working-directory: api
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      - name: Vendor workspace packages into api/node_modules
        run: |
          set -e
          mkdir -p api/node_modules/@rightsnow
          rm -rf api/node_modules/@rightsnow/shared api/node_modules/@rightsnow/legal-core
          cp -a packages/shared api/node_modules/@rightsnow/shared
          cp -a packages/legal-core api/node_modules/@rightsnow/legal-core

      - name: Debug — Functions deploy folder (api/ must be standalone)
        run: |
          set -e
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          ls -la
          find . -maxdepth 4 \( -name host.json -o -name function.json -o -name package.json \) 2>/dev/null | head -n 120
          echo "--- api/ (Azure/functions-action package: api) ---"
          ls -la api
          echo "--- api/dist ---"
          ls -la api/dist
          echo "--- api/dist/functions ---"
          ls -la api/dist/functions
          test -f api/host.json || { echo '::error::api/host.json missing'; exit 1; }
          test -f api/package.json || { echo '::error::api/package.json missing'; exit 1; }
          test -f api/dist/index.js || { echo '::error::api/dist/index.js missing — build step failed'; exit 1; }
          main=$(node -p "require('./api/package.json').main")
          if [ "$main" != "dist/index.js" ]; then
            echo "::error::api/package.json main must be dist/index.js (got: $main)"
            exit 1
          fi
          if [ -L api/node_modules/@rightsnow/shared ] || [ -L api/node_modules/@rightsnow/legal-core ]; then
            echo '::error::@rightsnow/* must be vendored directories, not npm symlinks (breaks zip deploy)'
            ls -la api/node_modules/@rightsnow || true
            exit 1
          fi
          if find api/node_modules/@rightsnow -type l 2>/dev/null | grep -q .; then
            echo '::error::Unexpected symlinks under api/node_modules/@rightsnow:'
            find api/node_modules/@rightsnow -type l
            exit 1
          fi
          node -e "require('./api/node_modules/@rightsnow/shared'); require('./api/node_modules/@rightsnow/legal-core');"
          node -e "require('./api/dist/index.js'); console.log('bootstrap: api/dist/index.js loaded');"
          echo "package.json main=$main"
          echo "node=$(node -v) npm=$(npm -v)"

      - name: Check Azure RBAC credentials secret
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo '::error::Set repository secret AZURE_CREDENTIALS (see workflow header comment)'
            exit 1
          fi

      - name: Azure Login (RBAC)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Pre-built api/ only: api uses file:../packages/* — remote Oryx/Kudu npm install cannot resolve those paths on Azure.
      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: iterlaw-api-001
          package: api
          scm-do-build-during-deployment: 'false'
          enable-oryx-build: 'false'

      - name: Check Static Web Apps deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo '::error::Set repository secret AZURE_STATIC_WEB_APPS_API_TOKEN'
            exit 1
          fi

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDc5NzI4MDAsImV4cCI6MTk2MzU0ODgwMH0.E316OMskv_dswTnvNDcDsFkXORI_MTO1SmIzsTbfvsQ' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ''
          # Hybrid Next.js on SWA: empty output_location (not .next / out). See
          # https://learn.microsoft.com/en-us/azure/static-web-apps/deploy-nextjs-hybrid
          output_location: ''
          is_static_export: false
          app_build_command: 'npm run build -w @rightsnow/shared && npm run build -w @rightsnow/web'
          skip_app_build: false
