name: Validate RAG Accuracy

on:
  workflow_run:
    workflows: ["Chunk and Generate Embeddings"]
    types: [completed]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: pgvector/pgvector:pg16-latest
        env:
          POSTGRES_USER: iterlaw_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: iterlaw_knowledge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary requests pytest

      - name: Run RAG tests
        env:
          DATABASE_URL: postgresql://iterlaw_user:${{ secrets.DB_PASSWORD }}@localhost:5432/iterlaw_knowledge
        run: |
          # Create a dummy test if it doesn't exist
          mkdir -p tests
          if [ ! -f tests/rag_tests.py ]; then
            cat > tests/rag_tests.py << 'EOF'
import pytest
import os
import psycopg2

def test_database_connection():
    db_url = os.environ.get("DATABASE_URL")
    conn = psycopg2.connect(db_url)
    assert conn is not None
    conn.close()
EOF
          fi
          pytest tests/rag_tests.py -v --junit-xml=test-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-test-results
          path: test-results.xml
