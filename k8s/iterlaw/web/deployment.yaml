apiVersion: apps/v1
kind: Deployment
metadata:
  name: iterlaw-web
  namespace: iterlaw-ai
  labels:
    app.kubernetes.io/name: iterlaw-web
    app.kubernetes.io/part-of: iterlaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iterlaw-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iterlaw-web
        app.kubernetes.io/part-of: iterlaw
    spec:
      serviceAccountName: iterlaw-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        runAsGroup: 10003
        fsGroup: 10003
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iterlaw-web
          image: iterlaw/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iterlaw-web-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
