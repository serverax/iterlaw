apiVersion: apps/v1
kind: Deployment
metadata:
  name: iterlaw-legal-orchestrator
  namespace: iterlaw
  labels:
    app.kubernetes.io/name: iterlaw-legal-orchestrator
    app.kubernetes.io/part-of: iterlaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iterlaw-legal-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iterlaw-legal-orchestrator
        app.kubernetes.io/part-of: iterlaw
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legal-orchestrator
          image: iterlaw/legal-orchestrator:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3012
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iterlaw-legal-orchestrator-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iterlaw-legal-orchestrator-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
