apiVersion: v1
kind: ConfigMap
metadata:
  name: legal-orchestrator-config
  namespace: iterlaw-ai
  labels:
    app.kubernetes.io/name: legal-orchestrator
    app.kubernetes.io/part-of: iterlaw
data:
  NODE_ENV: production
  PORT: "3012"
  LOG_LEVEL: info
  RAG_MODE: postgres
  SYNTHESIS_MODE: redis_streams
  SYNTHESIS_REQUEST_STREAM: iterlaw:synthesis:requests
  SYNTHESIS_RESPONSE_STREAM: iterlaw:synthesis:responses
  SYNTHESIS_TIMEOUT_MS: "15000"
  EXTERNAL_LLM_ENABLED: "false"
  EXTERNAL_LLM_USED: "false"
  WASM_RULES_ENABLED: "true"
  WASM_RULES_PATH: /app/wasm-rules
