# IterLaw RBAC — namespace iterlaw-data.
#
# Same policy as k8s/iterlaw/rbac.yaml: no ClusterRole, no
# ClusterRoleBinding, no API access. The iterlaw-postgres ServiceAccount
# does not need to query the Kubernetes API at all.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iterlaw-postgres-no-api
  namespace: iterlaw-data
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iterlaw-postgres-no-api
  namespace: iterlaw-data
subjects:
  - kind: ServiceAccount
    name: iterlaw-postgres
    namespace: iterlaw-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iterlaw-postgres-no-api
