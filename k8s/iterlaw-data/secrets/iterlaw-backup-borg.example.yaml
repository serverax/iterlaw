# Example SealedSecret template for the Hetzner Storage Box + Borg
# remote-backup path described in docs/infra/BACKUP_AND_RESTORE_RUNBOOK.md.
#
# DO NOT commit real values. Replace the REPLACE_ME_* placeholders on
# the operator workstation, then run kubeseal to produce the sealed
# YAML — that sealed file is what gets committed under
# k8s/iterlaw-data/secrets/. The raw file MUST NOT enter git.
#
# Sealing workflow (operator workstation only):
#   1. cp this file /tmp/iterlaw-backup-borg.raw.yaml
#   2. Edit /tmp/...raw.yaml — fill in the real BORG_PASSPHRASE / SSH
#      key / repo URL.
#   3. kubeseal --controller-namespace kube-system \
#                --controller-name sealed-secrets-controller \
#                --format yaml \
#                < /tmp/iterlaw-backup-borg.raw.yaml \
#                > k8s/iterlaw-data/secrets/iterlaw-backup-borg.yaml
#   4. shred -u /tmp/iterlaw-backup-borg.raw.yaml
#
# The annotation below is checked by scripts/infra/verify-iterlaw-backup.sh
# — any file carrying `iterlaw.io/example-only: "true"` is verified to
# contain only REPLACE_ME placeholders.

apiVersion: v1
kind: Secret
metadata:
  name: iterlaw-backup-borg
  namespace: iterlaw-data
  annotations:
    iterlaw.io/example-only: "true"
type: Opaque
stringData:
  # Borg repository URL — Hetzner Storage Box SFTP target.
  # Example shape: ssh://uXXXXXX@uXXXXXX.your-storagebox.de:23/./iterlaw-pg
  BORG_REPO: REPLACE_ME_BORG_REPO

  # Repokey passphrase. Set on first `borg init --encryption=repokey-blake2`.
  BORG_PASSPHRASE: REPLACE_ME_BORG_PASSPHRASE

  # Hetzner Storage Box host (e.g. uXXXXXX.your-storagebox.de).
  STORAGEBOX_HOST: REPLACE_ME_STORAGEBOX_HOST

  # Hetzner Storage Box user (e.g. uXXXXXX).
  STORAGEBOX_USER: REPLACE_ME_STORAGEBOX_USER

  # OpenSSH private key for the Storage Box. Single-line PEM with `\n`
  # newlines preserved, OR multi-line via a YAML `|` block. Either way
  # this REPLACE_ME value goes in raw; kubeseal seals it.
  SSH_PRIVATE_KEY: REPLACE_ME_SSH_PRIVATE_KEY

  # Known-hosts pin for the Storage Box host key. Prevents MITM on
  # first connection.
  SSH_KNOWN_HOSTS: REPLACE_ME_STORAGEBOX_KNOWN_HOST_KEY

  # Alerting placeholders (no real values committed). The upload +
  # verify CronJobs no-op these when empty.
  BACKUP_ALERT_WEBHOOK_URL: REPLACE_ME_OPTIONAL_WEBHOOK
  BACKUP_ALERT_TELEGRAM_BOT_TOKEN: REPLACE_ME_OPTIONAL_TELEGRAM_TOKEN
  BACKUP_ALERT_TELEGRAM_CHAT_ID: REPLACE_ME_OPTIONAL_TELEGRAM_CHAT
