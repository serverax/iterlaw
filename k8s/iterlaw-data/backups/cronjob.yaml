apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iterlaw-postgres-backup
  namespace: iterlaw-data
  labels:
    app.kubernetes.io/name: iterlaw-postgres-backup
    app.kubernetes.io/part-of: iterlaw
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iterlaw-postgres-backup
  namespace: iterlaw-data
  labels:
    app.kubernetes.io/name: iterlaw-postgres-backup
    app.kubernetes.io/part-of: iterlaw
spec:
  # 02:15 every night. Adjust per operations review.
  schedule: "15 2 * * *"
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iterlaw-postgres-backup
            app.kubernetes.io/part-of: iterlaw
        spec:
          restartPolicy: Never
          # Reuse the iterlaw-postgres SA. Both the StatefulSet pod and
          # the backup pod are bound to the same no-api Role in
          # k8s/iterlaw-data/rbac.yaml, so neither has any Kubernetes
          # API permissions. Defense-in-depth keeps the default SA
          # in iterlaw-data unreferenced by any IterLaw workload.
          serviceAccountName: iterlaw-postgres
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: iterlaw-postgres.iterlaw-data.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: iterlaw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: iterlaw-postgres-credentials
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: iterlaw-postgres-credentials
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backups/iterlaw-${ts}.sql.gz"
                  echo "writing ${out}"
                  pg_dump --format=plain --no-owner --no-privileges \
                    --schema=uk_emp_rag \
                    "${PGDATABASE}" | gzip -9 > "${out}"
                  echo "backup complete:"
                  ls -lh "${out}"
              # Retention is intentionally manual. Old files in /backups
              # accumulate until an operator prunes them. See README.md.
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: iterlaw-postgres-backup
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
