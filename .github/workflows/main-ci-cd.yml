# RightsNow / IterLaw unified pipeline (Phase A — 7 gates)
# Gate 1 lint | 2 types | 3 test | 4 security | 5 build | 6 deploy-staging | 7 production approval
name: RightsNow Full Pipeline

on:
  push:
    branches: [main, master, develop, 'feature/**']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: main-ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Gate 1 — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Prettier (apps/packages only)
        run: npm run format:check
        continue-on-error: true

  types:
    name: Gate 2 — Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check
      - name: Legal orchestrator typecheck
        working-directory: apps/legal-orchestrator
        run: |
          npm ci
          npm run typecheck

  test:
    name: Gate 3 — Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDc5NzI4MDAsImV4cCI6MTk2MzU0ODgwMH0.E316OMskv_dswTnvNDcDsFkXORI_MTO1SmIzsTbfvsQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:ci -- --coverageReporters=lcov --coverageReporters=text-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
      - uses: codecov/codecov-action@v4
        if: hashFiles('coverage/lcov.info') != ''
        continue-on-error: true
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-orchestrator:
    name: Gate 3b — Legal orchestrator (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/legal-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/legal-orchestrator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  security:
    name: Gate 4 — Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm run audit:fix-check
        continue-on-error: true
      - name: npm audit production
        run: npm run security:scan
        continue-on-error: true

  build:
    name: Gate 5 — Build
    needs: [lint, types, test, test-orchestrator, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Web production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDc5NzI4MDAsImV4cCI6MTk2MzU0ODgwMH0.E316OMskv_dswTnvNDcDsFkXORI_MTO1SmIzsTbfvsQ
        run: |
          set -e
          mkdir -p apps/web/node_modules/@iterlaw
          rm -rf apps/web/node_modules/@iterlaw/shared
          cp -a packages/shared apps/web/node_modules/@iterlaw/shared
          npm run build
      - name: Backend compile
        working-directory: backend
        run: |
          npm ci
          npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Docker smoke build (orchestrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/legal-orchestrator/Dockerfile
          push: false
          tags: iterlaw/legal-orchestrator:ci-smoke

  deploy-staging:
    name: Gate 6 — Deploy staging
    needs: build
    if: github.ref == 'refs/heads/develop' && vars.ENABLE_AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure staging
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Staging container deploy (placeholder)
        run: echo "Configure AZURE_* secrets and rightsnow-staging webapp name before enabling."

  approve-production:
    name: Gate 7 — Production approval
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Manual approval recorded
        run: echo "Production deployment approved at $(date -u +%Y-%m-%dT%H:%M:%SZ) for ${{ github.sha }}"
