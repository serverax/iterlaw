# SealedSecret template for IterLaw.
#
# DO NOT paste plaintext secrets into this file. Use kubeseal to encrypt
# values into an `encryptedData` block:
#
#   kubeseal --controller-namespace kube-system \
#     --controller-name sealed-secrets-controller \
#     --format yaml \
#     < raw-secret.yaml > k8s/iterlaw/secrets/iterlaw-<name>.yaml
#
# The encrypted output replaces the placeholder below.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # iterlaw-db-secret lives in iterlaw-ai and points the orchestrator at
  # the Postgres service in iterlaw-data. Encrypted value example:
  #   DATABASE_URL=postgresql://USER:PASSWORD@iterlaw-postgres.iterlaw-data.svc.cluster.local:5432/iterlaw?sslmode=disable
  name: iterlaw-db-secret
  namespace: iterlaw-ai
spec:
  encryptedData:
    DATABASE_URL: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: iterlaw-db-secret
      namespace: iterlaw-ai
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: iterlaw-synthesis-redis
  namespace: iterlaw-ai
spec:
  encryptedData:
    SYNTHESIS_REDIS_URL: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: iterlaw-synthesis-redis
      namespace: iterlaw-ai
    type: Opaque
---
# Optional. Only required when synthesis-worker runs in MODEL_MODE=internal.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: iterlaw-synthesis-internal-model
  namespace: iterlaw-ai
spec:
  encryptedData:
    INTERNAL_MODEL_ENDPOINT: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: iterlaw-synthesis-internal-model
      namespace: iterlaw-ai
    type: Opaque
