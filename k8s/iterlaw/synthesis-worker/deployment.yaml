apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthesis-worker
  namespace: iterlaw-ai
  labels:
    app.kubernetes.io/name: synthesis-worker
    app.kubernetes.io/part-of: iterlaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthesis-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthesis-worker
        app.kubernetes.io/part-of: iterlaw
    spec:
      serviceAccountName: synthesis-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synthesis-worker
          image: iterlaw/synthesis-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: synthesis-worker-config
          env:
            - name: SYNTHESIS_WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SYNTHESIS_REDIS_URL_FROM_SECRET
              valueFrom:
                secretKeyRef:
                  name: iterlaw-synthesis-redis
                  key: SYNTHESIS_REDIS_URL
            - name: INTERNAL_MODEL_ENDPOINT_FROM_SECRET
              valueFrom:
                secretKeyRef:
                  name: iterlaw-synthesis-internal-model
                  key: INTERNAL_MODEL_ENDPOINT
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
